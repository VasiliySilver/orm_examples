[project]
name = "orm_examples"
version = "0.1.0"
description = "A short description of my project."
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.12" # <-- ИСПРАВЛЕНО: используем ~ вместо ~
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.11",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0.44",
]

[tool.uv]
# Configuration specific to uv can go here

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
addopts = "--strict-markers"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.commitizen]
name = "cz_conventional_commits"

[dependency-groups]
dev = [
    "black>=25.11.0",
    "commitizen>=4.10.0",
    "debugpy>=1.8.17",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "pytest>=9.0.1",
    "ruff>=0.14.8",
]
